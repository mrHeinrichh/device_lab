name: device_lab
description: >-
  Preview your Flutter app on any device without a simulator: 149 devices,
  foldables with real display features, free-form resolutions, and
  golden-test integration.
version: 0.3.1
repository: https://github.com/mrHeinrichh/device_lab
issue_tracker: https://github.com/mrHeinrichh/device_lab/issues
screenshots:
  - description: >-
      The iPhone Duo unfolded, drawn from Apple's published dimensions, with
      the fold reported to the app so a two-pane layout switches on by itself.
    path: screenshots/preview-foldable.png
  - description: >-
      The closed Duo turned to landscape: camera, buttons and spine turn with
      the body, and the bar shows the resolution with zoom controls.
    path: screenshots/duo-closed-rotated.png
  - description: >-
      The preview hidden, showing the app at the real window size with a
      draggable restore button docked to a corner.
    path: screenshots/original-screen.png

topics:
  - responsive
  - preview
  - devtools
  - testing
  - foldable

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
