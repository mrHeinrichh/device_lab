name: device_lab
description: >-
  Preview your Flutter app on any device without a simulator: 149 devices,
  foldables with real display features, free-form resolutions, and
  golden-test integration.
version: 0.3.0
repository: https://github.com/mrHeinrichh/device_lab
issue_tracker: https://github.com/mrHeinrichh/device_lab/issues
screenshots:
  - description: >-
      The tools panel beside an iPhone Duo, unfolded in its natural landscape
      pose. The demo app picks a two-pane layout from the fold display feature.
    path: screenshots/preview-foldable.png
  - description: >-
      A Galaxy Z Flip 7 on its cover screen, 367 by 349 logical pixels, with
      the platform switched to Android.
    path: screenshots/flip-cover.png
  - description: >-
      The preview hidden, showing the app at the real window size with a
      draggable restore button docked to a corner.
    path: screenshots/original-screen.png

topics:
  - responsive
  - preview
  - devtools
  - testing
  - foldable

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
